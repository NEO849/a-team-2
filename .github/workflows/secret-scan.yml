name: secret-scan

# No-Secrets-Gate in CI: catches anything a bypassed local hook would miss.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history, or deep leaks are missed
      - name: gitleaks (default rules + repo denylist)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trufflehog (verified secrets, fail on hit)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --fail
